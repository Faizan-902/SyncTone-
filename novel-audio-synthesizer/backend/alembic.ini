# ==============================================================================
# SyncTone — Alembic Migration Configuration
# ==============================================================================

[alembic]
# Path to migration environment scripts
script_location = %(here)s/alembic

# Template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# Prepend sys.path with the backend root
prepend_sys_path = %(here)s

# Timezone for generated migrations
timezone = UTC

# Maximum length of characters for slug field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
revision_environment = false

# Database connection URL (can be overridden dynamically by DATABASE_URL environment variable)
sqlalchemy.url = postgresql://synctone_user:synctone_pass@localhost:5432/synctone

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
